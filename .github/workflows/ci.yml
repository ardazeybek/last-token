# ci.yml — runs the Python tests on every push and pull request
name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5
      # uv ships every Python version on every runner (setup-python has no 3.9 for Ubuntu 26.04)
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --no-project python -m unittest discover system/tests
