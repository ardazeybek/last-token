name: Bug report
description: Something in Last Token does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Setup
      description: Operating system, and how you run Claude Code (terminal, desktop app, VS Code, JetBrains).
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `python3 ~/.claude/last-token/ctx.py doctor`
      render: text
